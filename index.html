<script>
  // ---- Firebase setup ----
  const firebaseConfig = {
    apiKey: "AIzaSyBaMalavfe4iegNAhdFzdlmYm1X74EHeZs",
    authDomain: "shah-brother.firebaseapp.com",
    databaseURL: "https://shah-brother-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shah-brother",
    storageBucket: "shah-brother.firebasestorage.app",
    messagingSenderId: "1097676510247",
    appId: "1:1097676510247:web:84ff837bf972675abfaa02"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ---- Sign in anonymously so security rules can require auth ----
  const authReady = new Promise((resolve) => {
    firebase.auth().onAuthStateChanged((user) => {
      if (user) resolve(user);
    });
  });
  firebase.auth().signInAnonymously().catch((err) => {
    console.error("Anonymous sign-in failed:", err);
  });

  // ---- window.storage shim (drop-in, same shape the app expects) ----
  window.storage = {
    get: async function (key, shared) {
      await authReady;
      const snap = await db.ref('ledger/' + key).once('value');
      if (!snap.exists()) {
        throw new Error('Key not found: ' + key);
      }
      return { key: key, value: snap.val(), shared: !!shared };
    },
    set: async function (key, value, shared) {
      await authReady;
      await db.ref('ledger/' + key).set(value);
      return { key: key, value: value, shared: !!shared };
    },
    delete: async function (key, shared) {
      await authReady;
      await db.ref('ledger/' + key).remove();
      return { key: key, deleted: true, shared: !!shared };
    },
    list: async function (prefix, shared) {
      await authReady;
      const snap = await db.ref('ledger').once('value');
      const all = snap.val() || {};
      const keys = Object.keys(all).filter((k) => !prefix || k.startsWith(prefix));
      return { keys: keys, prefix: prefix, shared: !!shared };
    },
  };
</script>

function monthKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabel(mk) {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function displayName(obj) {
  if (!obj) return "";
  return obj.nameUrdu ? `${obj.name} / ${obj.nameUrdu}` : obj.name;
}

function uid(prefix) {
  return prefix + Math.random().toString(36).slice(2, 8).toUpperCase();
}
function pastMonths(count = 15) {
  const arr = [];
  const now = new Date();
  for (let i = 0; i < count; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    arr.push(monthKey(d));
  }
  return arr;
}
function money(n) {
  const v = Number(n) || 0;
  return "Rs " + v.toLocaleString("en-PK", { maximumFractionDigits: 0 });
}
function sum(arr, fn) {
  return arr.reduce((a, b) => a + (Number(fn(b)) || 0), 0);
}

/* ---------------------------------------------------------
   CLOUD DATA LAYER — shared storage + offline queue
   NOTE: This app cannot use browser localStorage (not
   supported in this environment). "Offline" support here
   means: entries typed while the connection drops are held
   in memory and auto-synced the moment the connection comes
   back, as long as this tab stays open. If the tab is fully
   closed before syncing, unsynced entries would be lost —
   so keep the app open until you see "Synced".
--------------------------------------------------------- */
function useCloud() {
  const [online, setOnline] = useState(true);
  const [pending, setPending] = useState([]); // [{key, value}]
  const queueRef = useRef([]);

  useEffect(() => {
    const test = async () => {
      try {
        await window.storage.get("__ping__", true);
        setOnline(true);
      } catch (e) {
        // get throws even for missing key (that's fine, means we reached network)
        setOnline(true);
      }
    };
    test();
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    return () => {
      window.removeEventListener("online", onOnline);
      window.removeEventListener("offline", onOffline);
    };
  }, []);

  const flush = useCallback(async () => {
    if (queueRef.current.length === 0) return;
    const items = [...queueRef.current];
    for (const item of items) {
      try {
        await window.storage.set(item.key, JSON.stringify(item.value), true);
        queueRef.current = queueRef.current.filter((q) => q.id !== item.id);
        setPending([...queueRef.current]);
        setOnline(true);
      } catch (e) {
        setOnline(false);
        break;
      }
    }
  }, []);

  useEffect(() => {
    const t = setInterval(flush, 4000);
    return () => clearInterval(t);
  }, [flush]);

  const save = useCallback(
    async (key, value) => {
      // optimistic — try immediately, queue on failure
      try {
        await window.storage.set(key, JSON.stringify(value), true);
        setOnline(true);
        return true;
      } catch (e) {
        const id = uid("q");
        queueRef.current = [...queueRef.current, { id, key, value }];
        setPending([...queueRef.current]);
        setOnline(false);
        return false;
      }
    },
    []
  );

  const load = useCallback(async (key, fallback) => {
    try {
      const res = await window.storage.get(key, true);
      if (!res || res.value === undefined) return fallback;
      return JSON.parse(res.value);
    } catch (e) {
      return fallback;
    }
  }, []);

  return { save, load, online, pendingCount: pending.length, flush };
}

/* ---------------------------------------------------------
   MONTHLY REGISTER — all months, totals only (no days)
   Reused by Owner (per dukandar) and Dukandar (own view)
--------------------------------------------------------- */
function MonthlyRegister({ cloud, dukandarId, monthsBack = 24 }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!dukandarId) return;
    (async () => {
      setLoading(true);
      const months = pastMonths(monthsBack);
      const out = [];
      for (const mk of months) {
        const e = (await cloud.load(`entries:${dukandarId}:${mk}`, [])) || [];
        if (e.length === 0) continue;
        const t = { dum: 0, kachra: 0, charbi: 0, machli: 0, paya: 0 };
        e.forEach((rec) => ITEM_KEYS.forEach((k) => (t[k] += Number(rec[k]) || 0)));
        const isAllZero = ITEM_KEYS.every((k) => t[k] === 0);
        if (isAllZero) continue;
        out.push({ mk, ...t });
      }
      setRows(out);
      setLoading(false);
    })();
  }, [dukandarId, cloud, monthsBack]);

  if (loading) return <div style={{ color: COLORS.inkSoft, padding: 10 }}>Load ho raha hai…</div>;

  return (
    <Card>
      <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Register — Har Month ka Total</div>
      {rows.length === 0 ? (
        <div style={{ color: COLORS.inkSoft, fontSize: 13.5 }}>Abhi tak koi mahine ka data nahi mila.</div>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead>
              <tr style={{ textAlign: "left", color: COLORS.inkSoft, borderBottom: `2px solid ${COLORS.line}` }}>
                <th style={{ padding: 8 }}>Month</th>
                {ITEMS.map((i) => <th key={i} style={{ padding: 8 }}>{i} (kg)</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.mk} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                  <td style={{ padding: 8, fontWeight: 700, color: COLORS.maroon }}>{monthLabel(r.mk)}</td>
                  {ITEM_KEYS.map((k) => <td key={k} style={{ padding: 8 }}>{r[k]}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </Card>
  );
}

function MonthPicker({ value, onChange }) {
  const months = pastMonths(18);
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)} style={{ ...inputStyle, width: "auto", fontWeight: 600 }}>

/* ---------------------------------------------------------
   WORKER DASHBOARD
--------------------------------------------------------- */
function WorkerDashboard({ session, cloud, view: viewProp, setView: setViewProp }) {
  const [localView, setLocalView] = useState("entry");
  const view = viewProp || localView;
  const setView = setViewProp || setLocalView;
  const [dukandars, setDukandars] = useState([]);
  const [selected, setSelected] = useState(null);
  const [mk] = useState(monthKey());
  const [entries, setEntries] = useState([]);
  const [form, setForm] = useState({ date: todayISO(), dum: "", kachra: "", charbi: "", machli: "", paya: "" });
  const [submission, setSubmission] = useState(null);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");

  useEffect(() => {
    (async () => {
      const all = (await cloud.load("meta:dukandars", [])) || [];
      const mine = all.filter((d) => d.workerId === session.id && !d.archived);
      setDukandars(mine);
      if (mine.length) setSelected(mine[0].id);
      const sub = await cloud.load(`submission:${session.id}:${mk}`, null);
      setSubmission(sub);
      setLoading(false);
    })();
  }, [cloud, session.id, mk]);

  useEffect(() => {
    if (!selected) return;
    (async () => {
      const e = (await cloud.load(`entries:${selected}:${mk}`, [])) || [];
      setEntries(e.sort((a, b) => (a.date < b.date ? 1 : -1)));
    })();
  }, [selected, mk, cloud]);

  const addEntry = async () => {
    const rec = {
      date: form.date,
      dum: Number(form.dum) || 0,
      kachra: Number(form.kachra) || 0,
      charbi: Number(form.charbi) || 0,
      machli: Number(form.machli) || 0,
      paya: Number(form.paya) || 0,
      enteredBy: session.name,
    };
    const updated = [rec, ...entries.filter((e) => e.date !== rec.date)];
    setEntries(updated);
    await cloud.save(`entries:${selected}:${mk}`, updated);
    setForm({ date: todayISO(), dum: "", kachra: "", charbi: "", machli: "", paya: "" });
  };

  const submitMonth = async () => {
    const rec = { submitted: true, submittedAt: new Date().toISOString() };
    setSubmission(rec);
    await cloud.save(`submission:${session.id}:${mk}`, rec);
  };

  const selDukandar = dukandars.find((d) => d.id === selected);
  const monthTotal = useMemo(() => {
    const t = { dum: 0, kachra: 0, charbi: 0, machli: 0, paya: 0 };
    entries.forEach((e) => ITEM_KEYS.forEach((k) => (t[k] += Number(e[k]) || 0)));
    return t;
  }, [entries]);

  if (loading) return <div style={{ padding: 30, color: COLORS.inkSoft }}>Load ho raha hai…</div>;

  return (
    <div style={{ padding: 16, maxWidth: 720, margin: "0 auto" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <button onClick={() => setView("entry")} style={{ flex: 1, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${COLORS.line}`, background: view === "entry" ? COLORS.red : "#fff", color: view === "entry" ? "#fff" : COLORS.maroon, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Dukandar Entry</button>
        <button onClick={() => setView("factory")} style={{ flex: 1, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${COLORS.line}`, background: view === "factory" ? COLORS.red : "#fff", color: view === "factory" ? "#fff" : COLORS.maroon, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Factory Sales</button>
      </div>

      {view === "factory" ? (
        <div style={{ margin: "0 -16px" }}>
          <FactoryPage cloud={cloud} canManageRate={false} session={session} />
        </div>
      ) : (
      <>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <div>
          <div style={{ fontWeight: 700, color: COLORS.maroon, fontSize: 17 }}>{monthLabel(mk)}</div>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>{dukandars.length} dukandar assigned</div>
        </div>
        {submission?.submitted ? (
          <span style={{ background: "#EAF4EC", color: COLORS.ok, fontSize: 12.5, fontWeight: 700, padding: "6px 12px", borderRadius: 999 }}>
            ✓ Submitted to Owner
          </span>
        ) : (
          <Btn variant="gold" onClick={submitMonth}>Submit Month to Owner</Btn>
        )}
      </div>

      {dukandars.length === 0 ? (
        <Card><div style={{ color: COLORS.inkSoft }}>Abhi koi dukandar assign nahi hua. Owner se assign karwayein.</div></Card>
      ) : (
        <>
          {dukandars.length > 6 && (
            <input
              style={{ ...inputStyle, marginBottom: 10 }}
              placeholder="Naam se search karein…"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          )}
          <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 14, paddingBottom: 4 }}>
            {dukandars
              .filter((d) => {
                const q = search.trim().toLowerCase();
                if (!q) return true;
                return d.name.toLowerCase().includes(q) || (d.nameUrdu || "").includes(search.trim());
              })
              .map((d) => (
              <button
                key={d.id}
                onClick={() => setSelected(d.id)}
                style={{
                  padding: "9px 14px",
                  borderRadius: 10,
                  border: `1.5px solid ${selected === d.id ? COLORS.red : COLORS.line}`,
                  background: selected === d.id ? "#FBEAEA" : "#fff",
                  color: COLORS.maroon,
                  fontWeight: 600,
                  fontSize: 13.5,
                  whiteSpace: "nowrap",
                  cursor: "pointer",
                }}
              >
                {displayName(d)}
              </button>
            ))}
          </div>

          <Card style={{ marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>{displayName(selDukandar)} — Aaj ki Entry</div>
            <Field label="Date">
              <input type="date" style={inputStyle} value={form.date} max={todayISO()} onChange={(e) => setForm({ ...form, date: e.target.value })} />
            </Field>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 10 }}>
              {ITEM_KEYS.map((k, i) => (
                <Field key={k} label={ITEMS[i] + " (kg)"}>
                  <input
                    type="number"
                    inputMode="decimal"
                    style={inputStyle}
                    value={form[k]}
                    onChange={(e) => setForm({ ...form, [k]: e.target.value })}
                    placeholder="0"
                  />
                </Field>
              ))}
            </div>
            <Btn onClick={addEntry} style={{ width: "100%", marginTop: 4 }}>Save Entry</Btn>
          </Card>

          <div style={{ fontWeight: 700, color: COLORS.maroon, marginBottom: 8 }}>Is Month ka Total</div>
          <Card style={{ marginBottom: 16 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(100px,1fr))", gap: 8 }}>
              {ITEM_KEYS.map((k, i) => (
                <div key={k} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: COLORS.inkSoft, textTransform: "uppercase" }}>{ITEMS[i]}</div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: COLORS.red }}>{monthTotal[k]}</div>
                </div>
              ))}
            </div>
          </Card>

          <div style={{ fontWeight: 700, color: COLORS.maroon, marginBottom: 8 }}>History (is month)</div>
          <Card>
            {entries.length === 0 ? (
              <div style={{ color: COLORS.inkSoft, fontSize: 13.5 }}>Koi entry nahi hui abhi.</div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
                  <thead>
                    <tr style={{ textAlign: "left", color: COLORS.inkSoft }}>
                      <th style={{ padding: 6 }}>Date</th>
                      {ITEMS.map((i) => <th key={i} style={{ padding: 6 }}>{i}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {entries.map((e, idx) => (
                      <tr key={idx} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                        <td style={{ padding: 6 }}>{fmtDate(e.date)}</td>
                        {ITEM_KEYS.map((k) => <td key={k} style={{ padding: 6 }}>{e[k]}</td>)}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Card>
        </>
      )}
      </>
      )}
    </div>
  );
}

      for (const d of ds.filter((x) => !x.archived)) {

                  {ITEMS.map((i) => <th key={i} style={{ padding: 8 }}>{i} (kg)</th>)}
                  <th style={{ padding: 8 }}>Din</th>
                </tr>
              </thead>
              <tbody>
                {totals.map((r) => (
                  <tr key={r.id} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                    <td style={{ padding: 8, fontWeight: 700, color: COLORS.maroon }}>{r.name}</td>
                    {ITEM_KEYS.map((k) => <td key={k} style={{ padding: 8 }}>{r[k]}</td>)}

                    <td style={{ padding: 8, color: COLORS.gold }}>GRAND TOTAL</td>

/* ---------------------------------------------------------
   FACTORY SALES (Page 3) — shared by Owner & Worker
   Worker: sirf quantity likh sakta hai (rate nahi dikhta)
   Owner: poore month ka ek rate per item set karta hai
--------------------------------------------------------- */
function FactoryPage({ cloud, canManageRate, session }) {
  const [mk, setMk] = useState(monthKey());
  const [rows, setRows] = useState([]);
  const [rate, setRate] = useState({ dum: "", kachra: "", charbi: "", machli: "", paya: "" });
  const [form, setForm] = useState({ date: todayISO(), factoryName: "", item: ITEMS[0], qty: "" });
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const r = (await cloud.load(`factory:${mk}`, [])) || [];
      setRows(r.sort((a, b) => (a.date < b.date ? 1 : -1)));
      const rt = await cloud.load(`factoryRate:${mk}`, null);
      setRate(rt || { dum: "", kachra: "", charbi: "", machli: "", paya: "" });
      setLoading(false);
    })();
  }, [mk, cloud]);

  const addRow = async () => {
    if (!form.factoryName || !form.qty) return;
    const rec = {
      id: uid("F"),
      date: form.date,
      factoryName: form.factoryName,
      item: form.item,
      qty: Number(form.qty),
      enteredBy: session?.name || "Owner",
    };
    const updated = [rec, ...rows];
    setRows(updated);
    await cloud.save(`factory:${mk}`, updated);
    setForm({ date: todayISO(), factoryName: "", item: ITEMS[0], qty: "" });
  };

  const removeRow = async (id) => {
    const updated = rows.filter((r) => r.id !== id);
    setRows(updated);
    await cloud.save(`factory:${mk}`, updated);
  };

  const saveRate = async () => {
    await cloud.save(`factoryRate:${mk}`, rate);
  };

  // item-wise totals (qty), and amount computed from monthly rate,
  // falling back to any legacy per-row rate/amount for old records
  const itemTotals = useMemo(() => {
    const t = {};
    ITEM_KEYS.forEach((k) => (t[k] = { qty: 0, legacyAmount: 0 }));
    rows.forEach((r) => {
      const key = ITEM_KEYS[ITEMS.indexOf(r.item)];
      if (!key) return;
      t[key].qty += Number(r.qty) || 0;
      if (r.amount !== undefined) t[key].legacyAmount += Number(r.amount) || 0;
    });
    return t;
  }, [rows]);

  const grandTotal = useMemo(() => {
    return ITEM_KEYS.reduce((acc, k) => {
      const rt = Number(rate[k]) || 0;
      // Rows that carry their own legacy amount are counted as-is;
      // rows without one use qty * this month's rate.
      const legacyQty = rows.filter((r) => ITEM_KEYS[ITEMS.indexOf(r.item)] === k && r.amount !== undefined).reduce((a, r) => a + (Number(r.qty) || 0), 0);
      const newQty = itemTotals[k].qty - legacyQty;
      return acc + itemTotals[k].legacyAmount + newQty * rt;
    }, 0);
  }, [rate, itemTotals, rows]);

  return (
    <div style={{ padding: 16, maxWidth: 900, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontWeight: 700, fontSize: 17, color: COLORS.maroon }}>Factory Sales</div>
        <MonthPicker value={mk} onChange={setMk} />
      </div>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Add Record</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: 10 }}>
          <Field label="Date"><input type="date" style={inputStyle} value={form.date} max={todayISO()} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Factory Name"><input style={inputStyle} value={form.factoryName} onChange={(e) => setForm({ ...form, factoryName: e.target.value })} placeholder="e.g. Al-Madina Factory" /></Field>
          <Field label="Item">
            <select style={inputStyle} value={form.item} onChange={(e) => setForm({ ...form, item: e.target.value })}>
              {ITEMS.map((i) => <option key={i} value={i}>{i}</option>)}
            </select>
          </Field>
          <Field label="Qty (kg)"><input type="number" style={inputStyle} value={form.qty} onChange={(e) => setForm({ ...form, qty: e.target.value })} /></Field>
        </div>
        <Btn onClick={addRow} style={{ marginTop: 6 }}>Add</Btn>
      </Card>

      {canManageRate && (
        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 4, color: COLORS.maroon }}>Is Month ka Rate (per kg)</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 10 }}>Poore month ke liye har item ka ek rate — factory jo bhi de raha ho.</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(100px,1fr))", gap: 10 }}>
            {ITEM_KEYS.map((k, i) => (
              <Field key={k} label={ITEMS[i]}>
                <input type="number" style={inputStyle} value={rate[k]} onChange={(e) => setRate({ ...rate, [k]: e.target.value })} placeholder="0" />
              </Field>
            ))}
          </div>
          <Btn variant="gold" onClick={saveRate} style={{ marginTop: 4 }}>Save Rate</Btn>
        </Card>
      )}

      <Card>
        {loading ? (
          <div style={{ color: COLORS.inkSoft }}>Load ho raha hai…</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead>
                <tr style={{ textAlign: "left", color: COLORS.inkSoft }}>
                  <th style={{ padding: 6 }}>Date</th><th style={{ padding: 6 }}>Factory</th><th style={{ padding: 6 }}>Item</th>
                  <th style={{ padding: 6 }}>Qty</th><th />
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.id} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                    <td style={{ padding: 6 }}>{fmtDate(r.date)}</td>
                    <td style={{ padding: 6, fontWeight: 600 }}>{r.factoryName}</td>
                    <td style={{ padding: 6 }}>{r.item}</td>
                    <td style={{ padding: 6 }}>{r.qty}</td>
                    <td style={{ padding: 6 }}><button onClick={() => removeRow(r.id)} style={{ border: "none", background: "none", color: "#A63131", cursor: "pointer", fontSize: 12 }}>Remove</button></td>
                  </tr>
                ))}
                {rows.length === 0 && <tr><td colSpan={5} style={{ padding: 12, color: COLORS.inkSoft }}>Koi record nahi.</td></tr>}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {canManageRate && rows.length > 0 && (
        <Card style={{ marginTop: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Item-wise Total</div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead>
                <tr style={{ textAlign: "left", color: COLORS.inkSoft }}>
                  <th style={{ padding: 6 }}>Item</th><th style={{ padding: 6 }}>Total Qty (kg)</th>
                </tr>
              </thead>
              <tbody>
                {ITEM_KEYS.map((k, i) => (
                  <tr key={k} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                    <td style={{ padding: 6, fontWeight: 600 }}>{ITEMS[i]}</td>
                    <td style={{ padding: 6 }}>{itemTotals[k].qty}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ marginTop: 10, textAlign: "right", fontWeight: 700, color: COLORS.gold, fontSize: 15 }}>
            Grand Total: {money(grandTotal)}
          </div>
        </Card>
      )}
    </div>
  );
}

  useEffect(() => {
    (async () => {
      const ds = (await cloud.load("meta:dukandars", [])) || [];

  const totals = useMemo(() => {

  const lineAmounts = ITEM_KEYS.map((k, i) => ({

    if (!advForm.amount) return;

          </select>
          <MonthPicker value={mk} onChange={setMk} />

        <>

            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Set Rate per kg — {displayName(dukandar)}</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 10 }}>
              {ITEM_KEYS.map((k, i) => (
                <Field key={k} label={ITEMS[i]}>
                  <input type="number" style={inputStyle} value={rates[k]} onChange={(e) => setRates({ ...rates, [k]: e.target.value })} placeholder="0" />

                <strong>Advance Auto-Minus</strong> — {displayName(dukandar)} ke liye ON karein to advance khud bill se minus ho jayega. OFF hone par advance sirf track hota hai (jaisa default hai).

                  <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 19, color: COLORS.maroon }}>SHAH BROTHERS CHICKEN WASTAGE</div>

/* ---------------------------------------------------------
   OWNER — PAST DATA (manually add historical months)
--------------------------------------------------------- */
function yearMonthOptions(yearsBack = 6) {
  const now = new Date();
  const years = [];
  for (let y = now.getFullYear(); y >= now.getFullYear() - yearsBack; y--) years.push(y);
  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December",
  ];
  return { years, months };
}

function OwnerPastData({ cloud }) {
  const { years, months } = yearMonthOptions();
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [monthIdx, setMonthIdx] = useState(now.getMonth());
  const [dukandars, setDukandars] = useState([]);
  const [selected, setSelected] = useState(null);
  const [vals, setVals] = useState({ dum: "", kachra: "", charbi: "", machli: "", paya: "" });
  const [existing, setExisting] = useState(null);
  const [msg, setMsg] = useState("");

  const mk = `${year}-${String(monthIdx + 1).padStart(2, "0")}`;

  useEffect(() => {
    (async () => {
      const ds = (await cloud.load("meta:dukandars", [])) || [];
      setDukandars(ds);
      if (ds.length && !selected) setSelected(ds[0].id);
    })();
    // eslint-disable-next-line
  }, [cloud]);

  useEffect(() => {
    if (!selected) return;
    (async () => {
      const e = (await cloud.load(`entries:${selected}:${mk}`, [])) || [];
      const hist = e.find((r) => r.historical);
      setExisting(hist || null);
      setVals(
        hist
          ? { dum: hist.dum, kachra: hist.kachra, charbi: hist.charbi, machli: hist.machli, paya: hist.paya }
          : { dum: "", kachra: "", charbi: "", machli: "", paya: "" }
      );
    })();
  }, [selected, mk, cloud]);

  const save = async () => {
    setMsg("");
    const e = (await cloud.load(`entries:${selected}:${mk}`, [])) || [];
    const rec = {
      date: `${mk}-01`,
      dum: Number(vals.dum) || 0,
      kachra: Number(vals.kachra) || 0,
      charbi: Number(vals.charbi) || 0,
      machli: Number(vals.machli) || 0,
      paya: Number(vals.paya) || 0,
      historical: true,
      enteredBy: "Owner (manual)",
    };
    const updated = [rec, ...e.filter((r) => !r.historical)];
    await cloud.save(`entries:${selected}:${mk}`, updated);
    setExisting(rec);
    setMsg("Saved — is month ke consolidated total aur bill mein ye data shamil ho gaya hai.");
  };

  const dukandar = dukandars.find((d) => d.id === selected);

  return (
    <div style={{ padding: 16, maxWidth: 700, margin: "0 auto" }}>
      <div style={{ fontWeight: 700, fontSize: 17, color: COLORS.maroon, marginBottom: 6 }}>Purana Data Add Karein</div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        Purane register ka poora month ka total ek dafa mein daal dein — roz-roz likhne ki zaroorat nahi. Ye Monthly Totals aur Rate/Bill mein khud shamil ho jayega.
      </div>

      <Card>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10, marginBottom: 4 }}>
          <Field label="Dukandar">
            <select style={inputStyle} value={selected || ""} onChange={(e) => setSelected(e.target.value)}>
              {dukandars.map((d) => <option key={d.id} value={d.id}>{displayName(d)}</option>)}
            </select>
          </Field>
          <Field label="Month">
            <select style={inputStyle} value={monthIdx} onChange={(e) => setMonthIdx(Number(e.target.value))}>
              {months.map((m, i) => <option key={m} value={i}>{m}</option>)}
            </select>
          </Field>
          <Field label="Year">
            <select style={inputStyle} value={year} onChange={(e) => setYear(Number(e.target.value))}>
              {years.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
        </div>

        {existing && (
          <div style={{ fontSize: 12.5, color: COLORS.warn, marginBottom: 10 }}>
            Is dukandar/month ke liye pehle se purana data maujood hai — save karne par overwrite ho jayega.
          </div>
        )}

        <div style={{ fontWeight: 700, marginBottom: 8, color: COLORS.maroon }}>{displayName(dukandar)} — {months[monthIdx]} {year} Total (kg)</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(100px,1fr))", gap: 10 }}>
          {ITEM_KEYS.map((k, i) => (
            <Field key={k} label={ITEMS[i]}>
              <input type="number" style={inputStyle} value={vals[k]} onChange={(e) => setVals({ ...vals, [k]: e.target.value })} placeholder="0" />
            </Field>
          ))}
        </div>
        <Btn onClick={save} style={{ marginTop: 6 }}>Save Purana Data</Btn>
        {msg && <div style={{ marginTop: 10, fontSize: 13, color: COLORS.ok }}>{msg}</div>}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   OWNER — MANAGE (workers, dukandars, assignment, password)
--------------------------------------------------------- */
function OwnerManage({ cloud }) {
  const [workers, setWorkers] = useState([]);
  const [dukandars, setDukandars] = useState([]);
  const [wForm, setWForm] = useState({ name: "", nameUrdu: "", code: "" });
  const [dForm, setDForm] = useState({ name: "", nameUrdu: "", phone: "", address: "", pin: "", workerId: "" });
  const [pwdForm, setPwdForm] = useState({ current: "", next: "" });
  const [pwdMsg, setPwdMsg] = useState("");
  const [search, setSearch] = useState("");
  const [loading, setLoading] = useState(true);
  const [editWorkerId, setEditWorkerId] = useState(null);
  const [editWorkerForm, setEditWorkerForm] = useState({ name: "", nameUrdu: "", code: "" });
  const [editDukandarId, setEditDukandarId] = useState(null);
  const [editDukandarForm, setEditDukandarForm] = useState({ name: "", nameUrdu: "", phone: "", address: "", pin: "" });

  const refresh = useCallback(async () => {
    setLoading(true);
    setWorkers((await cloud.load("meta:workers", [])) || []);
    setDukandars((await cloud.load("meta:dukandars", [])) || []);
    setLoading(false);
  }, [cloud]);

  useEffect(() => { refresh(); }, [refresh]);

  const addWorker = async () => {
    if (!wForm.name || !wForm.code) return;
    const rec = { id: uid("W"), name: wForm.name, nameUrdu: wForm.nameUrdu, code: wForm.code.toUpperCase(), photo: "" };
    const updated = [...workers, rec];
    setWorkers(updated);
    await cloud.save("meta:workers", updated);
    setWForm({ name: "", nameUrdu: "", code: "" });
  };

  const addDukandar = async () => {
    if (!dForm.name || !dForm.pin) return;
    const rec = { id: uid("D"), name: dForm.name, nameUrdu: dForm.nameUrdu, phone: dForm.phone, address: dForm.address, pin: dForm.pin.toUpperCase(), workerId: dForm.workerId || null, archived: false, photo: "" };
    const updated = [...dukandars, rec];
    setDukandars(updated);
    await cloud.save("meta:dukandars", updated);
    setDForm({ name: "", nameUrdu: "", phone: "", address: "", pin: "", workerId: "" });
  };

  const reassign = async (dukandarId, workerId) => {
    const updated = dukandars.map((d) => (d.id === dukandarId ? { ...d, workerId: workerId || null } : d));
    setDukandars(updated);
    await cloud.save("meta:dukandars", updated);
  };

  const toggleArchive = async (dukandarId) => {
    const updated = dukandars.map((d) => (d.id === dukandarId ? { ...d, archived: !d.archived } : d));
    setDukandars(updated);
    await cloud.save("meta:dukandars", updated);
  };

  const startEditWorker = (w) => {
    setEditWorkerId(w.id);
    setEditWorkerForm({ name: w.name, nameUrdu: w.nameUrdu || "", code: w.code });
  };

  const saveEditWorker = async () => {
    if (!editWorkerForm.name || !editWorkerForm.code) return;
    const updated = workers.map((w) =>
      w.id === editWorkerId ? { ...w, name: editWorkerForm.name, nameUrdu: editWorkerForm.nameUrdu, code: editWorkerForm.code.toUpperCase() } : w
    );
    setWorkers(updated);
    await cloud.save("meta:workers", updated);
    setEditWorkerId(null);
  };

  const startEditDukandar = (d) => {
    setEditDukandarId(d.id);
    setEditDukandarForm({ name: d.name, nameUrdu: d.nameUrdu || "", phone: d.phone || "", address: d.address || "", pin: d.pin });
  };

  const saveEditDukandar = async () => {
    if (!editDukandarForm.name || !editDukandarForm.pin) return;
    const updated = dukandars.map((d) =>
      d.id === editDukandarId
        ? { ...d, name: editDukandarForm.name, nameUrdu: editDukandarForm.nameUrdu, phone: editDukandarForm.phone, address: editDukandarForm.address, pin: editDukandarForm.pin.toUpperCase() }
        : d
    );
    setDukandars(updated);
    await cloud.save("meta:dukandars", updated);
    setEditDukandarId(null);
  };

  const changePwd = async () => {
    setPwdMsg("");
    const meta = (await cloud.load("meta:owner", null)) || { password: "shah123" };
    if (pwdForm.current !== meta.password) {
      setPwdMsg("Current password ghalat hai.");
      return;
    }
    if (!pwdForm.next || pwdForm.next.length < 4) {
      setPwdMsg("Naya password kam az kam 4 characters ka ho.");
      return;
    }
    await cloud.save("meta:owner", { password: pwdForm.next });
    setPwdMsg("Password update ho gaya.");
    setPwdForm({ current: "", next: "" });
  };

  if (loading) return <div style={{ padding: 30, color: COLORS.inkSoft }}>Load ho raha hai…</div>;

  return (
    <div style={{ padding: 16, maxWidth: 950, margin: "0 auto", display: "grid", gap: 16 }}>
      <Card>
        <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Add Worker</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
          <Field label="Name (English)"><input style={inputStyle} value={wForm.name} onChange={(e) => setWForm({ ...wForm, name: e.target.value })} /></Field>
          <Field label="Naam (Urdu) — optional"><input style={{ ...inputStyle, direction: "rtl", fontFamily: "'Noto Nastaliq Urdu', serif" }} value={wForm.nameUrdu} onChange={(e) => setWForm({ ...wForm, nameUrdu: e.target.value })} placeholder="مثلاً بلال" /></Field>
          <Field label="Unique Code"><input style={inputStyle} value={wForm.code} onChange={(e) => setWForm({ ...wForm, code: e.target.value })} placeholder="e.g. W1" /></Field>
        </div>
        <Btn onClick={addWorker}>Add Worker</Btn>
        <div style={{ marginTop: 12, display: "flex", flexWrap: "wrap", gap: 8 }}>
          {workers.map((w) => (
            <button
              key={w.id}
              onClick={() => startEditWorker(w)}
              style={{ background: "#F6EEDD", padding: "6px 12px", borderRadius: 999, fontSize: 13, fontWeight: 600, color: COLORS.maroon, border: "none", cursor: "pointer" }}
            >
              {displayName(w)} <span style={{ color: COLORS.inkSoft }}>({w.code})</span> <span style={{ color: COLORS.gold }}>✎</span>
            </button>
          ))}
        </div>
        {editWorkerId && (
          <div style={{ marginTop: 14, padding: 14, borderRadius: 10, background: "#FBF6EC", border: `1px solid ${COLORS.line}` }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Edit Worker</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
              <Field label="Name (English)"><input style={inputStyle} value={editWorkerForm.name} onChange={(e) => setEditWorkerForm({ ...editWorkerForm, name: e.target.value })} /></Field>
              <Field label="Naam (Urdu)"><input style={{ ...inputStyle, direction: "rtl" }} value={editWorkerForm.nameUrdu} onChange={(e) => setEditWorkerForm({ ...editWorkerForm, nameUrdu: e.target.value })} /></Field>
              <Field label="Code"><input style={inputStyle} value={editWorkerForm.code} onChange={(e) => setEditWorkerForm({ ...editWorkerForm, code: e.target.value })} /></Field>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn onClick={saveEditWorker}>Save</Btn>
              <Btn variant="ghost" onClick={() => setEditWorkerId(null)}>Cancel</Btn>
            </div>
          </div>
        )}
      </Card>

      <Card>
        <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Add Dukandar</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
          <Field label="Name (English)"><input style={inputStyle} value={dForm.name} onChange={(e) => setDForm({ ...dForm, name: e.target.value })} /></Field>
          <Field label="Naam (Urdu) — optional"><input style={{ ...inputStyle, direction: "rtl", fontFamily: "'Noto Nastaliq Urdu', serif" }} value={dForm.nameUrdu} onChange={(e) => setDForm({ ...dForm, nameUrdu: e.target.value })} placeholder="مثلاً احمد اسٹور" /></Field>
          <Field label="Phone"><input style={inputStyle} value={dForm.phone} onChange={(e) => setDForm({ ...dForm, phone: e.target.value })} /></Field>
          <Field label="Address"><input style={inputStyle} value={dForm.address} onChange={(e) => setDForm({ ...dForm, address: e.target.value })} /></Field>
          <Field label="Unique PIN"><input style={inputStyle} value={dForm.pin} onChange={(e) => setDForm({ ...dForm, pin: e.target.value })} placeholder="e.g. D101" /></Field>
          <Field label="Assign Worker">
            <select style={inputStyle} value={dForm.workerId} onChange={(e) => setDForm({ ...dForm, workerId: e.target.value })}>
              <option value="">— none —</option>
              {workers.map((w) => <option key={w.id} value={w.id}>{displayName(w)}</option>)}
            </select>
          </Field>
        </div>
        <Btn onClick={addDukandar}>Add Dukandar</Btn>
      </Card>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
          <div style={{ fontWeight: 700, color: COLORS.maroon }}>All Dukandars — Assignment</div>
          <input
            style={{ ...inputStyle, width: 220 }}
            placeholder="Naam ya PIN se search karein…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead>
              <tr style={{ textAlign: "left", color: COLORS.inkSoft }}>
                <th style={{ padding: 6 }}>Name</th><th style={{ padding: 6 }}>PIN</th><th style={{ padding: 6 }}>Worker</th><th style={{ padding: 6 }}>Status</th><th />
              </tr>
            </thead>
            <tbody>
              {dukandars
                .filter((d) => {
                  const q = search.trim().toLowerCase();
                  if (!q) return true;
                  return (
                    d.name.toLowerCase().includes(q) ||
                    (d.nameUrdu || "").includes(search.trim()) ||
                    d.pin.toLowerCase().includes(q)
                  );
                })
                .map((d) => (
                <tr key={d.id} style={{ borderTop: `1px solid ${COLORS.line}`, opacity: d.archived ? 0.5 : 1 }}>
                  <td style={{ padding: 6, fontWeight: 600 }}>{displayName(d)}</td>
                  <td style={{ padding: 6 }}>{d.pin}</td>
                  <td style={{ padding: 6 }}>
                    <select style={{ ...inputStyle, padding: "4px 8px" }} value={d.workerId || ""} onChange={(e) => reassign(d.id, e.target.value)}>
                      <option value="">— none —</option>
                      {workers.map((w) => <option key={w.id} value={w.id}>{displayName(w)}</option>)}
                    </select>
                  </td>
                  <td style={{ padding: 6 }}>{d.archived ? "Archived" : "Active"}</td>
                  <td style={{ padding: 6, display: "flex", gap: 10 }}>
                    <button onClick={() => startEditDukandar(d)} style={{ border: "none", background: "none", color: COLORS.gold, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                      Edit
                    </button>
                    <button onClick={() => toggleArchive(d.id)} style={{ border: "none", background: "none", color: d.archived ? COLORS.ok : "#A63131", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                      {d.archived ? "Restore" : "Archive"}
                    </button>
                  </td>
                </tr>
              ))}
              {dukandars.length === 0 && <tr><td colSpan={5} style={{ padding: 10, color: COLORS.inkSoft }}>Koi dukandar nahi.</td></tr>}
            </tbody>
          </table>
        </div>
        {editDukandarId && (
          <div style={{ marginTop: 14, padding: 14, borderRadius: 10, background: "#FBF6EC", border: `1px solid ${COLORS.line}` }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Edit Dukandar</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
              <Field label="Name (English)"><input style={inputStyle} value={editDukandarForm.name} onChange={(e) => setEditDukandarForm({ ...editDukandarForm, name: e.target.value })} /></Field>
              <Field label="Naam (Urdu)"><input style={{ ...inputStyle, direction: "rtl" }} value={editDukandarForm.nameUrdu} onChange={(e) => setEditDukandarForm({ ...editDukandarForm, nameUrdu: e.target.value })} /></Field>
              <Field label="Phone"><input style={inputStyle} value={editDukandarForm.phone} onChange={(e) => setEditDukandarForm({ ...editDukandarForm, phone: e.target.value })} /></Field>
              <Field label="Address"><input style={inputStyle} value={editDukandarForm.address} onChange={(e) => setEditDukandarForm({ ...editDukandarForm, address: e.target.value })} /></Field>
              <Field label="PIN"><input style={inputStyle} value={editDukandarForm.pin} onChange={(e) => setEditDukandarForm({ ...editDukandarForm, pin: e.target.value })} /></Field>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn onClick={saveEditDukandar}>Save</Btn>
              <Btn variant="ghost" onClick={() => setEditDukandarId(null)}>Cancel</Btn>
            </div>
          </div>
        )}
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8 }}>Archive karne se dukandar ki active list se hat jata hai, lekin uska poora purana data hamesha safe rehta hai.</div>
      </Card>

      <Card>
        <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.maroon }}>Change Owner Password</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
          <Field label="Current Password"><input type="password" style={inputStyle} value={pwdForm.current} onChange={(e) => setPwdForm({ ...pwdForm, current: e.target.value })} /></Field>
          <Field label="New Password"><input type="password" style={inputStyle} value={pwdForm.next} onChange={(e) => setPwdForm({ ...pwdForm, next: e.target.value })} /></Field>
        </div>
        <Btn variant="gold" onClick={changePwd}>Update Password</Btn>
        {pwdMsg && <div style={{ marginTop: 8, fontSize: 13, color: pwdMsg.includes("update") ? COLORS.ok : "#A63131" }}>{pwdMsg}</div>}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   OWNER DASHBOARD SHELL
--------------------------------------------------------- */
function OwnerDashboard({ session, cloud, tab, setTab }) {
  const tabs = [
    { key: "live", label: "Live Feed" },
    { key: "totals", label: "Monthly Totals" },
    { key: "register", label: "Dukandar Register" },
    { key: "factory", label: "Factory Sales" },
    { key: "rates", label: "Rates & Bill" },
    { key: "salary", label: "Salary/Expenses" },
    { key: "past", label: "Purana Data" },
    { key: "manage", label: "Manage" },
  ];
  return (
    <>
      <Tabs tabs={tabs} active={tab} onChange={setTab} />
      {tab === "live" && <OwnerLive cloud={cloud} />}
      {tab === "totals" && <OwnerTotals cloud={cloud} />}
      {tab === "register" && <OwnerRegister cloud={cloud} />}
      {tab === "factory" && <FactoryPage cloud={cloud} canManageRate={true} session={session} />}
      {tab === "rates" && <OwnerRates cloud={cloud} />}
      {tab === "salary" && <OwnerSalary cloud={cloud} />}
      {tab === "past" && <OwnerPastData cloud={cloud} />}
      {tab === "manage" && <OwnerManage cloud={cloud} />}
    </>
  );
}

/* ---------------------------------------------------------
   ROOT APP
--------------------------------------------------------- */
function App() {
  const cloud = useCloud();
  const [session, setSession] = useState(null);
  const [ownerTab, setOwnerTab] = useState("live");
  const [workerView, setWorkerView] = useState("entry");

  const subtitle =
    session?.role === "owner" ? "Owner Dashboard" : session?.role === "worker" ? "Worker Entry" : session?.role === "dukandar" ? "Apna Record" : "";

  const goHome = () => {
    if (session?.role === "owner") setOwnerTab("live");
    if (session?.role === "worker") setWorkerView("entry");
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      {!session ? (
        <LoginScreen cloud={cloud} onLogin={setSession} />
      ) : (
        <>
          <TopBar session={session} subtitle={subtitle} onLogout={() => setSession(null)} onHome={goHome} />
          <StatusBar online={cloud.online} pendingCount={cloud.pendingCount} />
          {session.role === "owner" && <OwnerDashboard session={session} cloud={cloud} tab={ownerTab} setTab={setOwnerTab} />}
          {session.role === "worker" && <WorkerDashboard session={session} cloud={cloud} view={workerView} setView={setWorkerView} />}
          {session.role === "dukandar" && <DukandarDashboard session={session} cloud={cloud} />}
        </>
      )}
    </div>
  );
}
